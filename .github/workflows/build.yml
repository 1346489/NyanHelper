name: Build NyanHelper Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare/clean drawable & mipmap icon outputs
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || true

          rm -f app/src/main/res/drawable/nyan_avatar.png
          rm -f app/src/main/res/drawable/nyan_avatar.xml
          rm -f app/src/main/res/drawable/ic_launcher_foreground.png
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f app/src/main/res/drawable/bg_main.png
          rm -f app/src/main/res/drawable/bg_main.xml
          rm -rf app/src/main/res/mipmap-mdpi
          rm -rf app/src/main/res/mipmap-hdpi
          rm -rf app/src/main/res/mipmap-xhdpi
          rm -rf app/src/main/res/mipmap-xxhdpi
          rm -rf app/src/main/res/mipmap-xxxhdpi
          rm -rf app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi

          if [ -f "app_icon.png" ]; then
            convert app_icon.png -resize 512x512 -background white -gravity center -extent 512x512 app/src/main/res/drawable/nyan_avatar.png
            cp app/src/main/res/drawable/nyan_avatar.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
            convert app_icon.png -resize 108x108 -background transparent -gravity center -extent 108x108 app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${pair%%:*}"; size="${pair##*:}"
              mkdir -p "app/src/main/res/mipmap-${dir}"
              convert app_icon.png -resize "${size}x${size}" -background transparent -gravity center -extent "${size}x${size}" "app/src/main/res/mipmap-${dir}/ic_launcher.png"
            done
            echo "使用 app_icon.png 生成图标/头像"
          else
            # 没上传原图时用纯色粉色占位 png，保证编译不缺资源
            python3 - <<'PY'
from PIL import Image, ImageDraw
img = Image.new("RGBA", (512,512), (255,209,220,255))
d = ImageDraw.Draw(img)
d.ellipse((120,120,392,392), fill=(255,255,255,255))
img.save("app/src/main/res/drawable/nyan_avatar.png")
img.save("app/src/main/res/drawable-nodpi/ic_launcher_foreground.png")
for d,s in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
    import os
    os.makedirs(f"app/src/main/res/mipmap-{d}", exist_ok=True)
    Image.new("RGBA", (s,s), (255,209,220,255)).save(f"app/src/main/res/mipmap-{d}/ic_launcher.png")
PY
            echo "未找到 app_icon.png，使用占位 png"
          fi

          # bg_main.png 占位背景，避免任何 bg_main.xml 引用问题
          python3 - <<'PY'
from PIL import Image
Image.new("RGBA", (1080,1920), (255,240,246,255)).save("app/src/main/res/drawable/bg_main.png")
PY

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          cache-disabled: true
          arguments: assembleDebug
          build-root-directory: app

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug-apk
          path: app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk
