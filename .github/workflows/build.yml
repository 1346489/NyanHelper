name: Build NyanHelper Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate icons (always, with verification)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          # 清理旧的生成物
          rm -rf app/src/main/res/mipmap-*
          rm -f app/src/main/res/drawable/nyan_avatar.png
          rm -f app/src/main/res/drawable/bg_main.png
          rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          mkdir -p app/src/main/res/drawable-nodpi

          SRC="app_icon.png"
          if [ ! -f "$SRC" ]; then
            # 没原图就用纯粉圆占位（base64 内联 PNG，无需依赖）
            echo "iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAADwdgRKAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAALEwAACxMBAJqcGAAAADZ0RVh0U29mdHdhcmUAc2ltc2VsZWN0ZWQgZmlsZSBFbXVsYXRpb25zZUlkc3Vyb3VuZC5uZXQg0tZlAAAAAHZpV0AAAAAAElFTkSuQmCC" | base64 -d > "$SRC"
          fi

          # 生成 mipmap 各密度图标
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir="${pair%%:*}"; size="${pair##*:}"
            mkdir -p "app/src/main/res/mipmap-${dir}"
            convert "$SRC" -resize "${size}x${size}" -background transparent -gravity center -extent "${size}x${size}" "app/src/main/res/mipmap-${dir}/ic_launcher.png"
          done

          # 生成头像 & 前景
          convert "$SRC" -resize 512x512 -background white -gravity center -extent 512x512 app/src/main/res/drawable/nyan_avatar.png
          convert "$SRC" -resize 108x108 -background transparent -gravity center -extent 108x108 app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          # 生成背景
          convert -size 1080x1920 gradient:"#FFF0F6"-"#FFE3EC" app/src/main/res/drawable/bg_main.png

          # ===== 验证：列出生成的文件 =====
          echo "=== Generated files ==="
          ls -la app/src/main/res/mipmap-*/ic_launcher.png
          ls -la app/src/main/res/drawable/nyan_avatar.png
          ls -la app/src/main/res/drawable/bg_main.png
          ls -la app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          # ===== 断言：缺一个就直接失败 =====
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png || (echo "MISSING mdpi" && exit 1)
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || (echo "MISSING xxxhdpi" && exit 1)
          test -f app/src/main/res/drawable/nyan_avatar.png || (echo "MISSING nyan_avatar" && exit 1)
          test -f app/src/main/res/drawable/bg_main.png || (echo "MISSING bg_main" && exit 1)
          echo "All icon files generated successfully"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          cache-disabled: true
          arguments: assembleDebug
          build-root-directory: app

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug-apk
          path: app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk
