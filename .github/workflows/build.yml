name: Build NyanHelper Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate icons from app_icon.png
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi

          # 清理可能重复的旧资源/旧名
          rm -f app/src/main/res/drawable/bg_main.xml
          rm -f app/src/main/res/drawable/nyan_avatar.xml
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f app/src/main/res/drawable/ic_launcher_background.xml
          rm -f app/src/main/res/drawable/avatar.xml
          rm -f app/src/main/res/drawable/avatar.png
          rm -f app/src/main/res/drawable/ic_nyan_avatar.xml
          rm -f app/src/main/res/drawable/ic_nyan_avatar.png

          rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.xml
          rm -f app/src/main/res/drawable-nodpi/ic_launcher_background.xml

          rm -rf app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -rf app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f app/src/main/res/mipmap-*/ic_launcher_foreground.png
          rm -f app/src/main/res/mipmap-*/ic_launcher_round.png
          rm -f app/src/main/res/mipmap-*/ic_launcher_background.png

          if [ -f "app_icon.png" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick

            # 应用背景图：原图做窗口背景（png）
            convert app_icon.png -resize 1024x1024 -background "#FFF6FA" -gravity center -extent 1024x1024 app/src/main/res/drawable/bg_main.png

            # 头像/前景用原图
            convert app_icon.png -resize 512x512 -background white -gravity center -extent 512x512 app/src/main/res/drawable/nyan_avatar.png
            cp app/src/main/res/drawable/nyan_avatar.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
            cp app/src/main/res/drawable/nyan_avatar.png app/src/main/res/drawable/ic_launcher_foreground.png

            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${pair%%:*}"
              size="${pair##*:}"
              mkdir -p "app/src/main/res/mipmap-${dir}"
              convert app_icon.png -resize "${size}x${size}" -background transparent -gravity center -extent "${size}x${size}" "app/src/main/res/mipmap-${dir}/ic_launcher.png"
            done
            echo "使用 app_icon.png 生成图标"
          else
            echo "未找到 app_icon.png，请上传仓库根目录"
            exit 1
          fi

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: assembleDebug
          build-root-directory: app

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug-apk
          path: app/build/outputs/apk/debug/NyanHelper-${{ steps.version.outputs.VERSION_NAME }}-debug.apk
